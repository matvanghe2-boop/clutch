name: CI

# Les commits de données de la synchro horaire ne touchent pas au code :
# inutile de dépenser des minutes à le revérifier. Vercel les construit de
# toute façon pour les déployer.
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
