name: Synchroniser Liquipedia

# Toutes les 15 minutes, décalé de l'heure pile : GitHub retarde souvent les
# tâches planifiées à :00, où tout le monde se bouscule.
#
# Pourquoi GitHub Actions et pas un cron Vercel : sur le plan Hobby, Vercel
# n'exécute ses crons qu'une fois par jour. Le dépôt est public : les minutes
# d'Actions y sont illimitées.
#
# La synchro ne committe rien : elle publie l'instantané dans Vercel Blob, où
# le site le lit. Pas de commit, donc pas de redéploiement à chaque donnée.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Deux passes simultanées doubleraient le rythme des appels à Liquipedia
# (leur règle : une page toutes les 30 s).
concurrency:
  group: liquipedia-sync
  cancel-in-progress: false

permissions:
  contents: read
  # Pour le maintien en vie, en fin de passe.
  actions: write

env:
  # Adresse publique de l'instantané : rien de secret, ce sont les données du site.
  SNAPSHOT_URL: ${{ vars.SNAPSHOT_URL }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # La synchro n'a besoin que de quatre paquets. Installer tout le projet
      # (Next, React, l'outillage) prendrait plus de temps que la synchro
      # elle-même : on les installe à part et on les expose au dépôt.
      - name: Installer les dépendances de la synchro
        run: |
          npm install --prefix "$RUNNER_TEMP/sync" --no-audit --no-fund cheerio@1.2.0 domhandler@5 tsx@4 @vercel/blob@2
          ln -s "$RUNNER_TEMP/sync/node_modules" node_modules

      # L'heure de la dernière lecture de chaque page voyage de passe en passe
      # dans ce cache : elle change à chaque passe, la publier coûterait une
      # écriture Blob à chaque fois.
      - name: Reprendre l'état de la passe précédente
        uses: actions/cache/restore@v4
        with:
          path: .sync-cache/snapshot.json
          key: sync-state-${{ github.run_id }}
          restore-keys: sync-state-

      - name: Appliquer l'état le plus récent
        run: node_modules/.bin/tsx scripts/ci.ts restore .sync-cache/snapshot.json

      - name: Synchroniser
        run: node_modules/.bin/tsx scripts/refresh.ts --ci

      - name: Mettre l'état en cache
        if: always()
        run: |
          if [ -f data/snapshot.json ]; then
            mkdir -p .sync-cache && cp data/snapshot.json .sync-cache/snapshot.json
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .sync-cache/snapshot.json
          key: sync-state-${{ github.run_id }}

      - name: Publier si les données ont changé
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node_modules/.bin/tsx scripts/ci.ts publish

      # Dans un dépôt public, GitHub désactive les tâches planifiées après
      # 60 jours sans activité, sans prévenir. Comme la synchro ne committe
      # plus rien, le dépôt peut rester inactif longtemps : réactiver le
      # workflow par l'API remet ce compteur à zéro (la méthode de l'action
      # keepalive-workflow, sans commit). Une fois par jour suffit.
      - name: Garder la synchro en vie
        if: github.event_name == 'schedule' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "04" ] && [ "$(date -u +%M)" -lt 15 ]; then
            gh api --method PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"
            echo "Workflow réactivé : compteur d'inactivité remis à zéro."
          fi
